version: '3.8'

services:
  postgres:
    image: postgis/postgis:15-3.3
    container_name: vetice-postgres
    restart: unless-stopped
    environment:
      POSTGRES_USER: vetice
      POSTGRES_PASSWORD: vetice123
      POSTGRES_DB: vetice_bnb
    ports:
      - "5432:5432"
    volumes:
      - postgres_data:/var/lib/postgresql/data
      - ./init.sql:/docker-entrypoint-initdb.d/init.sql
    healthcheck:
      test: ["CMD-SHELL", "pg_isready -U vetice -d vetice_bnb"]
      interval: 10s
      timeout: 5s
      retries: 5

volumes:
  postgres_data:
